sday.</text><rect x="56" y="318" width="328" height="382" rx="20" fill="#1d2232" stroke="#323a50" /><g transform="translate(72 334) scale(0.83)" fill="none" stroke="#a99cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g><text x="100" y="351" font-size="17" font-weight="600" fill="#c4bbff" >实时字幕与纪要</text><text x="74" y="396" font-size="20" fill="#f1f3fb" font-weight="400"><tspan font-weight="600" fill="#f1f3fb">发布计划定在下周四。</tspan></text><path d="M74 460L366 460" stroke="#323a50"/><text x="74" y="496" font-size="15" fill="#b3bcd2" font-weight="400">决定：先向 10% 用户发布</text><text x="74" y="534" font-size="15" fill="#b3bcd2" font-weight="400">待办：运维周三前确认回滚方案</text><text x="74" y="572" font-size="15" fill="#b3bcd2" font-weight="400">负责人：林 · 周五检查指标</text><text x="74" y="640" font-size="13" fill="#7f89a3" font-weight="400">字幕、原文与行动项同步更新。</text><rect x="56" y="716" width="100" height="52" rx="26" fill="#262c3f" stroke="#323a50" /><g transform="translate(94 730) scale(1)" fill="none" stroke="#f1f3fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></g><rect x="170" y="716" width="100" height="52" rx="26" fill="url(#accent)" stroke="none" /><text x="220" y="749" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">纪要</text><rect x="284" y="716" width="100" height="52" rx="26" fill="#262c3f" stroke="#323a50" /><g transform="translate(322 730) scale(1)" fill="none" stroke="#f1f3fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></g><text x="220" y="796" font-size="13" font-weight="400" fill="#7f89a3" text-anchor="middle">浏览：字幕 · 决定 · 待办</text><rect x="162" y="812" width="116" height="5" rx="3" fill="#f1f3fb" stroke="none" /></g></g></svg>
